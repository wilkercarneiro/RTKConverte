# Publica as edge functions a partir do repositório quando algo em
# supabase/functions/ muda na main (ou sob demanda, pela aba Actions).
#
# Precisa do secret SUPABASE_ACCESS_TOKEN (token pessoal do dono do projeto,
# Supabase → Account → Access Tokens). Sem o secret o job só avisa e termina
# sem erro, para não deixar a main vermelha.
name: Deploy das edge functions

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Conferir o token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN não configurado — deploy pulado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.token.outputs.ok == 'true'
      - run: bash scripts/deploy-functions.sh
        if: steps.token.outputs.ok == 'true'
